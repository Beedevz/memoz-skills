name: check

on:
  push:
  pull_request:

# The repository promises that skills/ and hosts/ are generated from core/. Without a gate that
# promise is only a wish: a hand-edit would survive review, and the next render would silently
# revert it — the edit lost, the reason forgotten.
jobs:
  generated-files-match-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check.mjs
